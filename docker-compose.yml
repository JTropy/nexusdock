services:
  nexusdock:
    build: .
    image: nexusdock:local
    container_name: nexusdock
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18777:18777"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    volumes:
      - ${NEXUS_DATA_DIR:-./nexus-data}:/var/lib/nexus
      - ${RECALL_REPO_DIR:-./recall}:/recall
    environment:
      NEXUS_PUBLIC_URL: ${NEXUS_PUBLIC_URL:-}
      NEXUS_TRUSTED_PROXIES: "${NEXUS_TRUSTED_PROXIES:-127.0.0.1,::1}"
    # 与 Dockerfile HEALTHCHECK 一致，探针打 /ready（readiness）而不是 /health（liveness）。
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:18777/ready"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
