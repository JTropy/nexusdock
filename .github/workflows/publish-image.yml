name: Publish container

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  # 发布门禁：发布镜像必须先通过与 ci.yml 相同的完整验证（make ci + 生成物一致性）。
  # ci.yml 是单 job 工作流，这里直接内联同样步骤是最简单的复用方式；
  # 省略 ci.yml 末尾的 docker build 步骤——publish job 本身就会构建多架构镜像。
  # 触发 tag 推送时 CI 与本门禁会各跑一次完整验证，属于可接受的重复。
  ci:
    name: Full CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate, test and build
        run: make ci

      - name: Verify generated files are committed
        run: git diff --exit-code

  publish:
    name: Publish container images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe 需要完整历史与标签，才能得到与 Makefile 构建一致的版本号。
          fetch-depth: 0

      - name: Resolve build version
        id: buildmeta
        shell: bash
        run: |
          version="$(git describe --tags --always --dirty)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            agentdockio/nexusdock
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 与 Makefile 构建同源：二进制 buildinfo 与 OCI revision 标签都指向本次推送的提交，
          # 保证"镜像标签 sha-<短SHA> = 镜像内 revision = 目标提交"三者在发布时即一致。
          build-args: |
            NEXUS_VERSION=${{ steps.buildmeta.outputs.version }}
            NEXUS_REVISION=${{ github.sha }}
            NEXUS_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=nexusdock-runtime
          cache-to: type=gha,mode=max,scope=nexusdock-runtime,ignore-error=true

      - name: Report published digest
        run: echo "digest=${{ steps.push.outputs.digest }}"

  verify:
    name: Verify published container images
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 永远按本次 build-push 输出的不可变 manifest digest 验证，不能用 latest/semver alias：
      # workflow_dispatch 可从任意分支触发，而 alias 可能指向另一提交。
      - name: Verify image revision matches build commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_DIGEST" == sha256:* ]] || {
            echo "invalid published digest: ${PUBLISHED_DIGEST}" >&2
            exit 1
          }
          images=(
            "ghcr.io/${GITHUB_REPOSITORY}@${PUBLISHED_DIGEST}"
            "agentdockio/nexusdock@${PUBLISHED_DIGEST}"
          )
          for image in "${images[@]}"; do
            echo "Checking revision of ${image}"
            docker pull "$image"
            revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "OCI revision mismatch: got ${revision}, want ${GITHUB_SHA}" >&2
              exit 1
            fi
            # 构建上下文不含 .git，二进制出现完整 SHA 只能来自 build args 的 ldflags 注入。
            docker run --rm --entrypoint sh \
              -e NEXUS_EXPECTED_REVISION="${GITHUB_SHA}" \
              "$image" -c 'grep -q "$NEXUS_EXPECTED_REVISION" /usr/local/bin/nexusdock'
          done

      - name: Pull and run published images
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "ghcr.io/${GITHUB_REPOSITORY}@${PUBLISHED_DIGEST}"
            "agentdockio/nexusdock@${PUBLISHED_DIGEST}"
          )
          for image in "${images[@]}"; do
            echo "Verifying ${image}"
            docker pull "$image"
            name="nexus-verify-${RANDOM}"
            docker run -d --name "$name" "$image"
            ready=false
            for _ in $(seq 1 30); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name")"
              if [[ "$status" == healthy ]]; then
                ready=true
                break
              fi
              if [[ "$(docker inspect -f '{{.State.Status}}' "$name")" == exited ]]; then
                docker logs "$name"
                exit 1
              fi
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              docker inspect "$name"
              docker logs "$name"
              exit 1
            fi
            docker inspect -f '{{json .RepoDigests}}' "$image"
            docker rm -f "$name"
          done
